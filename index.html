<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I.ETM201 онлайн шалгалт</title>
<style>
:root{--bg:#ffffff;--surface:#ffffff;--text:#1d2530;--muted:#5c6673;--line:#d9dee4;--accent:#0e7c86;--accent-ink:#ffffff;--soft:#e8f4f5;--ok:#1f7a4d;--okbg:#e2f3ea;--bad:#b3362b;--badbg:#f8e5e2;--warn:#a85a0a;--warnbg:#fbeedd;--code:#f2f4f6;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:900px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:26px;line-height:1.2;margin:8px 0 4px}
h2{font-size:21px;margin:0 0 4px}
h3{font-size:17px;margin:0 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 220px}
label{display:block;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=password],select,textarea{width:100%;font:inherit;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:150px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:15px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 16px;min-height:44px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.danger{border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);margin:0 -16px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .who{flex:1 1 200px;min-width:0}
.bar .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;padding:4px 12px;border-radius:10px;background:var(--soft);color:var(--text)}
.timer.low{background:var(--warnbg);color:var(--warn)}
.timer.crit{background:var(--badbg);color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;flex:1 1 100%}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.q{padding:12px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.qn{font-weight:700;margin-right:6px}
.tf{display:flex;gap:8px;margin-top:8px}
.tf button{min-width:84px}
.tf button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.opts{display:grid;gap:6px;margin-top:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt b{min-width:20px}
.fill input[type=text]{display:inline-block;width:150px;margin:2px 6px;padding:6px 10px}
.parts div{margin:3px 0}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--text)}
.note{background:var(--warnbg);color:var(--text);border-radius:10px;padding:10px 12px;margin:10px 0}
.code{font-family:ui-monospace,Consolas,monospace;font-size:13px;word-break:break-all;background:var(--code);padding:10px;border-radius:10px;max-height:180px;overflow:auto;width:100%;min-height:120px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{min-width:30px;text-align:center;padding:2px 6px;border-radius:7px;font-size:13px;font-weight:700}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.no{background:var(--badbg);color:var(--bad)}
.chip.na{background:var(--code);color:var(--muted)}
.sol{background:var(--code);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:15px;white-space:pre-wrap}
.stu{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace;font-size:14px}
.pts{width:80px;display:inline-block;padding:6px 8px}
.footer{margin-top:24px;text-align:center;font-size:14px}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:6px;min-height:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .box{background:var(--surface);border-radius:14px;padding:20px;max-width:460px;width:100%}
.hide{display:none!important}
.figbox{max-width:520px;margin:8px 0;color:var(--text)}
.figbox .fig{width:100%;height:auto;display:block}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.th{position:relative;width:120px;height:120px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .x{position:absolute;top:4px;right:4px;min-height:0;width:28px;height:28px;padding:0;border-radius:99px;line-height:1;background:var(--surface)}
.pimgs{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.pimgs img{max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff}
@media (max-width:520px){h1{font-size:22px}.fill input[type=text]{width:120px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const CONFIG = { durationMin: 80, perTF: 0.1, perMC: 0.1, perProb: 1.4, total: 10 };
const VARIANTS = [{"id": 1, "tf": ["Гүүрэн шулуутгагч нь дөрвөн диодтой.", "Цахиурын (Si) хориотой зурвасын өргөн ойролцоогоор 1.1 эВ байдаг.", "Урвуу биастай диодоор зөвхөн үндсэн бус цэнэг зөөгчийн жижиг урвуу ханалтын гүйдэл Is гүйнэ.", "Өрөөний температурт (27 °C) дулааны хүчдэл VT ойролцоогоор 0.7 В байдаг.", "Si диодтой гүүрэн шулуутгагчийн гаралтын оргил хүчдэл ойролцоогоор Vm − 0.7 В байна.", "Цэвэр хагас дамжуулагчид чөлөөт электроны тоо нүхний тооноос үргэлж их байдаг.", "Хагас дамжуулагчийн эсэргүүцэл температур өсөхөд буурдаг.", "β = IC / IE бөгөөд α = IC / IB байна.", "Транзисторын гүйдлүүдийн хамаарал: IE = IC + IB.", "Бааз ерөнхий холболтод гүйдлийн өсгөлт β дахин их байдаг.", "Бааз нь маш нимгэн, сул хольцолсон тул эмиттерийн ихэнх электрон коллекторт хүрдэг.", "Si диодын нээгдэх хүчдэл VK ойролцоогоор 0.3 В байдаг.", "Хагас долгионы шулуутгагчид диодын PIV ≥ Vm байх ёстой.", "Гүүрэн шулуутгагчийн ачаалалд гүйдлийн чиглэл хагас үе бүрд солигдоно.", "Диодын гүйдэл шууд хүчдэлээс экспоненциал хамаардаг (Шоклигийн тэгшитгэл)."], "mc": [{"q": "Цэвэр цахиурын талст өрөөний температурт ямар шинжтэй вэ?", "o": ["Зөвхөн чөлөөт электронтой", "Чөлөөт электрон ба нүхний тоо тэнцүү", "Зөвхөн нүхтэй", "Цэнэг зөөгч огт байхгүй"]}, {"q": "p төрлийн хагас дамжуулагчийн үндсэн цэнэг зөөгч аль вэ?", "o": ["Электрон", "Протон", "Нүх", "Ион"]}, {"q": "Температур өсөхөд Si диодын шууд хүчдэл ойролцоогоор хэрхэн өөрчлөгдөх вэ?", "o": ["≈ +2.5 мВ/°C", "≈ −25 мВ/°C", "Огт өөрчлөгдөхгүй", "≈ −2.5 мВ/°C"]}, {"q": "Si диодтой цуваа хэлхээнд E = 12 В, R = 1.5 кΩ. Хялбаршуулсан загвараар (VK = 0.7 В) гүйдэл ID хэд вэ?", "o": ["7.53 мА", "8 мА", "8.47 мА", "7.07 мА"]}, {"q": "Дунд цэгтэй трансформаторт бүтэн долгионы шулуутгагчийн диодын PIV хэд байх ёстой вэ?", "o": ["PIV ≥ Vm", "PIV ≥ 2Vm", "PIV ≥ Vm/2", "PIV ≥ 0.636·Vm"]}, {"q": "Si диодтой хагас долгионы шулуутгагчийн оролт vi = 20 sin ωt (В). Гаралтын дундаж утга Vdc хэд вэ?", "o": ["6.36 В", "12.27 В", "6.14 В", "12.72 В"]}, {"q": "Si диодтой гүүрэн шулуутгагчийн оролт vi = 24 sin ωt (В). Гаралтын оргил хүчдэл хэд вэ?", "o": ["23.3 В", "24 В", "21.2 В", "22.6 В"]}, {"q": "BJT-ийн бааз яагаад нимгэн, сул хольцолсон байдаг вэ?", "o": ["Эмиттерийн электроны ихэнх нь коллекторт хүрэхийн тулд", "Эсэргүүцлийг ихэсгэхийн тулд", "Нээгдэх хүчдэлийг бууруулахын тулд", "Зөвхөн үйлдвэрлэлийг хямдруулахын тулд"]}, {"q": "α = 0.98 бөгөөд IE = 5 мА бол коллекторын гүйдэл IC хэд вэ?", "o": ["5.102 мА", "4.9 мА", "0.1 мА", "4.02 мА"]}, {"q": "Эмиттер–бааз шилжилт шууд, коллектор–бааз шилжилт урвуу биастай үед транзистор аль мужид ажиллах вэ?", "o": ["Хаалт", "Ханалт", "Идэвхтэй муж", "Нэвт цохилт"]}], "fl": ["Цэвэр цахиурын хориотой зурвасын өргөн Eg ≈ …………… эВ.", "27 °C үед дулааны хүчдэл VT ≈ …………… мВ.", "Si диодтой гүүрэн шулуутгагчийн гаралтын оргил хүчдэл Vm − …………… В.", "β = IC / …………… ба α = IC / …………… .", "IB = 40 мкА, β = 75 бол IC = …………… мА."], "pr": [{"title": "Бодлого 1", "pts": 1.4, "intro": "Si диодын ажлын цэг дээр VD = 0.7 В, ID = 5 мА байв.", "parts": ["(a) DC эсэргүүцэл RD-г ол. (0.5 оноо)", "(b) T = 27 °C үед динамик (ac) эсэргүүцэл rd-г ол (VT = 26 мВ, rB-г тооцохгүй). (0.5 оноо)", "(c) ID-г 2 дахин нэмэгдүүлбэл rd хэд болох вэ? Яагаад? (0.4 оноо)"]}, {"title": "Бодлого 2", "pts": 1.4, "intro": "Si диод, E = 12 В эх үүсвэр, R = 1.5 кΩ резистортой цуваа залгагдсан.", "parts": ["(a) Хялбаршуулсан загвар (VK = 0.7 В)-аар ID, VD, VR-г ол. (0.6 оноо)", "(b) Идеал диодын загвараар ID, VR-г ол. (0.4 оноо)", "(c) Идеал загварын ID-ийн алдааг хялбаршуулсан загвартай харьцуулж %-иар ол. (0.4 оноо)"]}, {"title": "Бодлого 3", "pts": 1.4, "intro": "Шулуутгагчийн оролт vi = 20 sin ωt (В), бүх диод Si (VK = 0.7 В).", "parts": ["(a) Хагас долгионы шулуутгагчийн гаралтын оргил хүчдэл, Vdc ба диодын PIV-г ол. (0.5 оноо)", "(b) Гүүрэн (бүтэн долгионы) шулуутгагчийн гаралтын оргил хүчдэл ба Vdc-г ол. (0.5 оноо)", "(c) Хоёр шулуутгагчийн гаралтын vo(t)-г ижил масштабтай зур. (0.4 оноо)"]}, {"title": " /* ---------- submit (automatic, to the teacher's database) ---------- */

}

/* ---------- grading (teacher) ---------- */
let KEY = null;
const LOOK = { "а": "a", "в": "b", "е": "e", "к": "k", "м": "m", "н": "h", "о": "o", "р": "p", "с": "c", "т": "t", "х": "x", "у": "y", "і": "i" };
function norm(s) { return String(s || "").toLowerCase().replace(/,/g, ".").replace(/[\s·*×.]+$/g, "").replace(/[\s·*×]/g, "").split("").map(c => LOOK[c] || c).join(""); }
function leadNum(s) { const m = /^[-+]?\d*\.?\d+/.exec(s); return m ? parseFloat(m[0]) : null; }
function altMatch(inp, alt) { const a = norm(alt); if (inp === a) return true; if (/^[-+]?\d*\.?\d+$/.test(a)) { const n = leadNum(inp); return n !== null && Math.abs(n - parseFloat(a)) < 1e-9; } return false; }
function fillOK(inputs, k) {
  const ins = inputs.map(norm);
  if (!ins.length || ins.some(x => !x)) return false;
  const ok = (i, j) => k.alts[j].some(a => altMatch(ins[i], a));
  if (!k.un) return ins.every((x, i) => ok(i, i));
  const used = new Set();
  const rec = (i) => { if (i === ins.length) return true; for (let j = 0; j < k.alts.length; j++) { if (!used.has(j) && ok(i, j)) { used.add(j); if (rec(i + 1)) return true; used.delete(j); } } return false; };
  return ins.length === k.alts.length && rec(0);
}
function grade(rec) {
  const k = KEY[rec.v - 1];
  const tf = rec.a.tf.map((x, i) => x == null ? null : (x === "T") === k.tf[i]);
  const mc = rec.a.mc.map((x, i) => x == null ? null : x === k.mc[i]);
  const fl = rec.a.fl.map((arr, i) => fillOK(arr || [], k.fl[i]));
  const cnt = a => a.filter(x => x === true).length;
  return { tf, mc, fl, s1: cnt(tf) * CONFIG.perTF, s2: (cnt(mc) + cnt(fl)) * CONFIG.perMC };
}
async function unlock(pass) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(KEYBLOB.s), iterations: KEYBLOB.i, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(KEYBLOB.iv) }, key, bytes(KEYBLOB.c));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- teacher ---------- */
let RECS = [], GRADES = {}, unsubs = [], FILES = [], RFULL = [], GFILTER = "all";
function manualTotal(uid) { const g = GRADES[uid]; return g && g.pts ? g.pts.reduce((a, x) => a + (x == null ? 0 : +x), 0) : 0; }
function manualDone(uid) { const g = GRADES[uid]; return !!(g && g.pts && g.pts.length === PRN && g.pts.every(x => x != null)); }
function allRecs() { return RECS.concat(FILES); }
function stopSubs() { unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; }
function backHome() { stopSubs(); if (S && S.start && !S.submitted) showTest(); else if (S && S.submitted) showStart(); else showStart(); }
function mergedRows() {
  const byCode = {}; allRecs().forEach(r => { if (r.c) byCode[normCode(r.c)] = r; });
  const known = new Set(RFULL.map(s => s.c));
  const out = RFULL.map(s => ({ s, r: byCode[s.c] || null }));
  allRecs().forEach(r => { if (!r.c || !known.has(normCode(r.c))) out.push({ s: { c: r.c || "?", n: r.n, g: r.g, vr: r.v }, r }); });
  return out.sort((a, b) => (a.s.g || "").localeCompare(b.s.g || "") || (a.s.n || "").localeCompare(b.s.n || "", "mn"));
}
function scoreOf(r) { if (!r) return null; const g = grade(r), m3 = manualTotal(r.uid); return { g, m3, done: manualDone(r.uid), total: g.s1 + g.s2 + m3 }; }

        catch (e) { err.textContent = "Серверт нэвтэрч чадсангүй. Имэйл, нууц үгээ шалгана уу."; err.classList.remove("hide"); return; }
      }

    root.append(el("h1", {}, "Багшийн хэсэг"), el("div", { class: "card" }, MODE === "gh" ? [el("label", { for: "tem" }, "Имэйл"), em] : null, el("label", { for: "pw" }, "Нууц үг"), pw, err, el("p", {}, el("button", { class: "primary", onclick: go }, "Нээх"), " ", el("button", { onclick: backHome }, "Буцах"))));
    return;
  }
  const info = msg("");
  const list = el("div"), seg = el("div", { class: "seg" });
  const groups = ["all"].concat([...new Set(RFULL.map(s => s.g))].sort());
  const render = () => {
    seg.replaceChildren(...groups.map(g => el("button", { class: GFILTER === g ? "sel" : "", onclick: () => { GFILTER = g; render(); } }, g === "all" ? "Бүгд" : "Бүлэг " + g)));

    const taken = rows.filter(x => x.r).length;
    let sum = 0, cnt = 0;
    const tb = el("table", {}, el("thead", {}, el("tr", {}, ["№", "Код", "Нэр", "Бүлэг", "Вар.", "Төлөв", "1-р", "2-р", "3-р", "Нийт /10", "Хугацаа", "Цонх", "Зураг", ""].map(h => el("th", {}, h)))));
    const body = el("tbody");
    rows.forEach((x, i) => {
      const r = x.r, sc = scoreOf(r);
      if (sc) { sum += sc.total; cnt++; }
      body.append(el("tr", {}, el("td", {}, i + 1), el("td", {}, x.s.c), el("td", {}, x.s.n), el("td", {}, x.s.g), el("td", {}, x.s.vr),
        el("td", {}, el("span", { class: "st " + (r ? "on" : "off") }, r ? "Өгсөн" : "Өгөөгүй")),
        el("td", {}, sc ? f1(sc.g.s1) + "/1.5" : "—"), el("td", {}, sc ? f1(sc.g.s2) + "/1.5" : "—"),
        el("td", {}, sc ? (sc.done ? f1(sc.m3) + "/7" : (sc.m3 ? f1(sc.m3) + "*" : "—")) : "—"),
        el("td", {}, sc ? el("b", {}, f1(sc.total) + (sc.done ? "" : "*")) : "—"),
        el("td", {}, r ? fmtTime((r.e - r.s) / 1000) : "—"), el("td", {}, r ? (r.tab || 0) : "—"), el("td", {}, r && r.ni ? r.ni.reduce((a, y) => a + y, 0) : "—"),
        el("td", {}, r ? el("button", { onclick: () => showDetail(r.uid) }, "Нээх") : "")));
    });
    tb.append(body);
    list.append(el("p", { class: "muted" }, "Өгсөн " + taken + " / " + rows.length + (cnt ? " · дундаж " + f1(sum / cnt) + " / 10" : "") + " (* 3-р хэсгийн оноо бүрэн биш)"), el("div", { style: "overflow-x:auto" }, tb));
  };
  const fileIn = el("input", { type: "file", accept: ".json,application/json", multiple: true, class: "hide", "aria-label": "Нөөц файл" });
  fileIn.onchange = async () => {
    let n = 0, bad = 0;
    for (const f of [...fileIn.files]) { try { const o = JSON.parse(await f.text()); if (o.fmt !== "etm201-fallback" || !o.rec) { bad++; continue; } const uid = "file_" + hash32(JSON.stringify(o.rec)); if (!FILES.find(x => x.uid === uid)) { FILES.push(Object.assign({}, o.rec, { uid, _imgs: o.imgs })); n++; } } catch (e) { bad++; } }
    fileIn.value = ""; render(); info.textContent = n + " нөөц файл нэмэгдлээ" + (bad ? ", " + bad + " уншигдсангүй." : ".");
  };
  root.append(el("h1", {}, "Багшийн хэсэг"),
    el("div", { class: "card" }, el("h2", {}, "Оюутнуудын хариу"), seg, list,
      el("div", { class: "row", style: "margin-top:12px" }, el("button", { class: "primary", onclick: exportCsv }, "CSV болгон хадгалах"), el("button", { onclick: () => fileIn.click() }, "Нөөц файл оруулах"), fileIn), info),
    el("div", { class: "card" }, el("h3", {}, "Түгжээ"), el("p", { class: "muted" }, "Энэ төхөөрөмжийн түгжээг цэвэрлэж туршилтаар дахин өгөх бол:"), el("button", { class: "danger", onclick: () => askYes("Энэ төхөөрөмжийн шалгалтын түгжээг цэвэрлэх үү?", () => { lockClear(); S = null; info.textContent = "Түгжээ цэвэрлэгдлээ."; }) }, "Түгжээ цэвэрлэх")),
    el("div", { class: "footer" }, el("button", { class: "link", onclick: backHome }, "Буцах")));
  render();
  stopSubs();
  if (DBC) {
    try {
      unsubs.push(DBC.collection(RES).onSnapshot(snap => { RECS = snap.docs.map(d => unpackRec(Object.assign({ uid: d.id }, d.data()))); render(); }, e => { info.textContent = "Хариу унших боломжгүй (" + (e && e.code) + ")."; }));
      unsubs.push(DBC.collection(GR).onSnapshot(snap => { GRADES = {}; snap.docs.forEach(d => { GRADES[d.id] = d.data(); }); render(); }, () => {}));
    } catch (e) { info.textContent = "Мэдээллийн санд холбогдож чадсангүй."; }
  }
}
function askYes(text, yes) {
  const m = modal(el("div", { class: "box" }, el("h3", {}, text), el("div", { class: "row", style: "margin-top:12px" }, el("button", { onclick: () => m.remove() }, "Үгүй"), el("button", { class: "danger", onclick: () => { m.remove(); yes(); } }, "Тийм"))));
}
function chips(arr, offset, show) {
  return el("div", { class: "chips" }, arr.map((x, i) => el("span", { class: "chip " + (x === true ? "ok" : x === false ? "no" : "na"), title: show ? show(i) : "" }, (offset + i + 1) + (x === true ? "✓" : x === false ? "✗" : "·"))));
}
async function showDetail(uid) {
  const r = allRecs().find(x => x.uid === uid); if (!r) return;
  stopSubs(); root.replaceChildren();
  const V = VARIANTS[r.v - 1], K = KEY[r.v - 1], g = grade(r);
  const tot = el("b", {});
  const upd = () => { tot.textContent = f1(g.s1 + g.s2 + manualTotal(uid)) + " / 10"; };
  const detail = el("div", { class: "card" }, el("h2", {}, "Автомат оноо"),
    el("p", {}, "1-р хэсэг: ", el("b", {}, f1(g.s1) + "/1.5"), "   2-р хэсэг: ", el("b", {}, f1(g.s2) + "/1.5")),
    el("h3", {}, "1-р хэсэг (Ү/Х)"), chips(g.tf, 0, i => "Оюутан: " + (r.a.tf[i] || "—") + "; зөв: " + (K.tf[i] ? "T" : "F")),
    el("h3", {}, "2-р хэсэг, сонгох"), chips(g.mc, 0, i => "Оюутан: " + (r.a.mc[i] || "—") + "; зөв: " + K.mc[i]),
    el("h3", {}, "2-р хэсэг, нөхөх"), chips(g.fl, 10, i => "Оюутан: " + (r.a.fl[i] || []).join(" ; ") + "; зөв: " + K.fl[i].show),
    el("p", { class: "muted" }, "Хулганыг тэмдэг дээр аваачвал оюутны болон зөв хариу харагдана."));

  root.append(el("p", {}, el("button", { onclick: showTeacher }, "← Жагсаалт")),
    el("h1", {}, r.n), el("p", { class: "muted" }, r.g + " · Вариант " + r.v + " · " + fmtTime((r.e - r.s) / 1000) + " · цонх солисон " + (r.tab || 0) + (r.auto ? " · хугацаа дуусч автоматаар илгээгдсэн" : "")), detail);

    try { const snap = await DBC.collection(RES + "/" + uid + "/img").get(); imgs = [[], [], [], [], []]; snap.docs.map(d => d.data()).sort((a, b) => a.p - b.p || a.k - b.k).forEach(d => { if (imgs[d.p]) imgs[d.p].push(d.d); }); } catch (e) { imgs = null; }
  }
  const solBox = el("div");
  const pts = (GRADES[uid] && GRADES[uid].pts) ? GRADES[uid].pts.slice() : Array(PRN).fill(null);
  let writing = Promise.resolve();
  V.pr.forEach((p, i) => {
    const inp = el("input", { type: "number", min: "0", max: "1.4", step: "0.1", class: "pts", "aria-label": p.title + " оноо" });
    if (pts[i] != null) inp.value = pts[i];
    inp.onchange = () => {
      pts[i] = inp.value === "" ? null : Math.min(1.4, Math.max(0, parseFloat(inp.value)));

      if (DBC && !String(uid).startsWith("file_")) writing = writing.then(() => DBC.doc(GR + "/" + uid).set({ pts: pts.slice() })).catch(() => {});
    };
    solBox.append(el("div", { class: "card" }, el("h3", {}, p.title),
      el("p", { class: "muted" }, "Оюутны бодолт:"),
      (imgs && imgs[i] && imgs[i].length) ? el("div", { class: "pimgs" }, imgs[i].map(src => el("img", { src, alt: p.title + " оюутны бодолт" }))) : el("p", { class: "muted" }, "(зураг оруулаагүй)"),
      (r.a.pr[i] || "").trim() ? el("div", { class: "stu" }, r.a.pr[i]) : null,
      el("p", { class: "muted" }, "Зөв бодолт ба оноо:"), el("div", { class: "sol", html: K.sol[i] }),
      el("label", {}, "Оноо (0–1.4) ", inp)));
  });
  root.append(el("div", { class: "card" }, el("h2", {}, "3-р хэсэг"), el("p", {}, "Нийт: ", tot)), solBox,
    el("div", { class: "card" }, el("h3", {}, "Дахин өгөх зөвшөөрөл"), el("p", { class: "muted" }, "Энэ оюутны хариуг устгавал оюутан шалгалтыг дахин өгч чадна."),
      el("button", { class: "danger", onclick: () => askYes("Энэ оюутны хариу, зураг, оноог устгах уу?", async () => {

          if (String(uid).startsWith("file_")) { FILES = FILES.filter(x => x.uid !== uid); }
          else {
            const s = await DBC.collection(RES + "/" + uid + "/img").get(); for (const d of s.docs) await DBC.doc(RES + "/" + uid + "/img/" + d.id).delete();
            await DBC.doc(RES + "/" + uid).delete(); await DBC.doc(GR + "/" + uid).delete();
            try { await DBC.doc(TAKEN + "/" + (MODE === "gh" ? uid : (r.c || ""))).delete(); } catch (e2) {}
          }

      }) }, "Хариуг устгах")));
  upd();
}
async function exportCsv() {
  const rows = [["№", "Оюутны код", "Овог нэр", "Бүлэг", "Вариант", "Төлөв", "1-р хэсэг", "2-р хэсэг", "3-р хэсэг", "Нийт /10", "Хугацаа", "Цонх солисон", "3-р хэсэг дууссан"]];
  mergedRows().forEach((x, i) => {
    const sc = scoreOf(x.r);
    rows.push([i + 1, x.s.c, x.s.n, x.s.g, x.s.vr, x.r ? "өгсөн" : "өгөөгүй", sc ? f1(sc.g.s1) : "", sc ? f1(sc.g.s2) : "", sc ? f1(sc.m3) : "", sc ? f1(sc.total) : "", x.r ? fmtTime((x.r.e - x.r.s) / 1000) : "", x.r ? (x.r.tab || 0) : "", sc ? (sc.done ? "тийм" : "үгүй") : ""]);
  });
  const csv = "\ufeff" + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\r\n");
  const ok = await saveFile("ETM201_results.csv", csv);
  if (!ok) { const w = el("textarea", { class: "code" }); w.value = csv; root.append(el("div", { class: "card" }, el("p", {}, "Файл хадгалах боломжгүй. Доорх текстийг хуулж Excel рүү буулга:"), w)); }
}

  if (S && S.start && !S.submitted) { await initCaps(); if (S.pending) { return doSubmit(!!S.pending.auto); } return showTest(); }
  showStart();
})();
